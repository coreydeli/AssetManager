services:
  postgres:
    image: postgres:15
    network_mode: host
    environment:
      POSTGRES_DB: asset_manager
      POSTGRES_USER: assetuser
      POSTGRES_PASSWORD: assetpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetuser -d asset_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: